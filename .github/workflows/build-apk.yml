name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK packages
      run: |
        yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Create project structure
      run: |
        rm -rf android-project
        mkdir -p android-project/app/src/main/java/com/stoicgenerator
        mkdir -p android-project/app/src/main/res/layout
        mkdir -p android-project/app/src/main/res/values
        mkdir -p android-project/app/src/main/res/mipmap-hdpi
        mkdir -p android-project/app/src/main/res/mipmap-xhdpi
        mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
        mkdir -p android-project/app/src/main/assets/www
        
        # Copy web app
        cp -r app/* android-project/app/src/main/assets/www/
        rm -rf android-project/app/src/main/assets/www/node_modules
        rm -f android-project/app/src/main/assets/www/package-lock.json
        
        echo "=== Web assets copied ==="
        ls -la android-project/app/src/main/assets/www/

    - name: Create AndroidManifest.xml
      run: |
        cat > android-project/app/src/main/AndroidManifest.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.stoicgenerator.app">

    <uses-permission android:name="android.permission.INTERNET" />

    <application
        android:allowBackup="true"
        android:label="Stoic Generator"
        android:supportsRtl="true"
        android:theme="@style/AppTheme">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:screenOrientation="portrait">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
XMLEOF

    - name: Create MainActivity.java
      run: |
        cat > android-project/app/src/main/java/com/stoicgenerator/MainActivity.java << 'JAVAEOF'
package com.stoicgenerator;

import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebSettings;
import android.webkit.WebViewClient;
import android.webkit.WebChromeClient;
import android.view.WindowManager;
import android.graphics.Color;
import android.os.Build;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        
        // Make fullscreen
        getWindow().setFlags(
            WindowManager.LayoutParams.FLAG_FULLSCREEN,
            WindowManager.LayoutParams.FLAG_FULLSCREEN
        );
        
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
            getWindow().setStatusBarColor(Color.parseColor("#0a0a0f"));
            getWindow().setNavigationBarColor(Color.parseColor("#0a0a0f"));
        }
        
        // Create WebView directly
        webView = new WebView(this);
        setContentView(webView);
        
        // Configure
        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setCacheMode(WebSettings.LOAD_DEFAULT);
        settings.setMediaPlaybackRequiresUserGesture(false);
        
        webView.setWebViewClient(new WebViewClient());
        webView.setWebChromeClient(new WebChromeClient());
        webView.setBackgroundColor(Color.parseColor("#0a0a0f"));
        
        webView.loadUrl("file:///android_asset/www/index.html");
    }

    @Override
    public void onBackPressed() {
        if (webView != null && webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
JAVAEOF

    - name: Create res/values/styles.xml
      run: |
        cat > android-project/app/src/main/res/values/styles.xml << 'STYLESEOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
        <item name="android:windowFullscreen">true</item>
        <item name="android:windowBackground">#0a0a0f</item>
    </style>
</resources>
STYLESEOF

    - name: Create res/values/colors.xml
      run: |
        cat > android-project/app/src/main/res/values/colors.xml << 'COLORSEOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="black">#0a0a0f</color>
    <color name="gold">#FFD700</color>
</resources>
COLORSEOF

    - name: Create project build.gradle
      run: |
        cat > android-project/build.gradle << 'GRADLEEOF'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
GRADLEEOF

    - name: Create app build.gradle
      run: |
        cat > android-project/app/build.gradle << 'APPEOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stoicgenerator.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.stoicgenerator.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
APPEOF

    - name: Create gradle.properties
      run: |
        cat > android-project/gradle.properties << 'PROPEOF'
android.useAndroidX=true
android.nonTransitiveRClass=true
PROPEOF

    - name: Create settings.gradle
      run: |
        cat > android-project/settings.gradle << 'SETEOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "StoicGenerator"
include ':app'
SETEOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build APK
      run: |
        cd android-project
        gradle assembleDebug

    - name: Verify APK
      run: |
        echo "=== APK Size ==="
        ls -lh android-project/app/build/outputs/apk/debug/app-debug.apk
        echo ""
        echo "=== APK Contents ==="
        unzip -l android-project/app/build/outputs/apk/debug/app-debug.apk | head -20

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StoicGenerator-APK
        path: android-project/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create PWA zip
      run: |
        cd app
        zip -r ../StoicGenerator-PWA.zip . -x "node_modules/*"

    - name: Upload PWA
      uses: actions/upload-artifact@v4
      with:
        name: StoicGenerator-PWA
        path: StoicGenerator-PWA.zip
        retention-days: 30
