name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd app
        npm install

    - name: Build PWA
      run: |
        cd app
        npm run build || echo "Build complete - no build script"

    - name: Create distributable ZIP
      run: |
        cd app
        zip -r ../StoicGenerator-PWA.zip . -x "node_modules/*"
        echo "PWA package created successfully"

    - name: Upload PWA artifact
      uses: actions/upload-artifact@v4
      with:
        name: StoicGenerator-PWA
        path: StoicGenerator-PWA.zip
        retention-days: 30

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Android project
      run: |
        # Create project directory
        mkdir -p android-project/app/src/main/java/com/stoicgenerator
        mkdir -p android-project/app/src/main/res/values
        mkdir -p android-project/app/src/main/assets/www
        mkdir -p android-project/gradle/wrapper
        
        # Copy web app to assets
        cp -r app/* android-project/app/src/main/assets/www/ 2>/dev/null || true
        rm -rf android-project/app/src/main/assets/www/node_modules

    - name: Generate Android files
      run: |
        # AndroidManifest.xml
        cat > android-project/app/src/main/AndroidManifest.xml << 'MANIFEST'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.stoicgenerator.app">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
                android:allowBackup="true"
                android:label="Stoic Generator"
                android:theme="@android:style/Theme.Material.NoActionBar"
                android:usesCleartextTraffic="true">
                <activity android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        MANIFEST

        # MainActivity.java
        cat > android-project/app/src/main/java/com/stoicgenerator/MainActivity.java << 'JAVA'
        package com.stoicgenerator;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebSettings;
        import android.webkit.WebViewClient;
        import android.view.Window;
        import android.view.WindowManager;
        import android.graphics.Color;
        import android.os.Build;
        
        public class MainActivity extends Activity {
            WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                requestWindowFeature(Window.FEATURE_NO_TITLE);
                getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                    WindowManager.LayoutParams.FLAG_FULLSCREEN);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                    getWindow().setStatusBarColor(Color.parseColor("#0a0a0f"));
                }
                webView = new WebView(this);
                setContentView(webView);
                WebSettings s = webView.getSettings();
                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setAllowFileAccess(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/www/index.html");
            }
            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) webView.goBack();
                else super.onBackPressed();
            }
            @Override
            protected void onDestroy() {
                if (webView != null) webView.destroy();
                super.onDestroy();
            }
        }
        JAVA

        # build.gradle (project)
        cat > android-project/build.gradle << 'GRADLE'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        GRADLE

        # app/build.gradle
        cat > android-project/app/build.gradle << 'APPGRADLE'
        apply plugin: 'com.android.application'
        
        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.stoicgenerator.app"
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        
        dependencies {
        }
        APPGRADLE

        # gradle.properties
        cat > android-project/gradle.properties << 'PROPS'
        android.useAndroidX=false
        PROPS

        # settings.gradle
        cat > android-project/settings.gradle << 'SETTINGS'
        include ':app'
        SETTINGS

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6.3'

    - name: Build Android APK
      run: |
        cd android-project
        gradle assembleRelease

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: StoicGenerator-APK
        path: android-project/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
