name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Create project
        run: |
          mkdir -p StoicApp/app/src/main/java/com/stoic
          mkdir -p StoicApp/app/src/main/assets/www
          mkdir -p StoicApp/app/src/main/res/values
          cp -r app/* StoicApp/app/src/main/assets/www/
          rm -rf StoicApp/app/src/main/assets/www/node_modules

      - name: Generate Gradle files
        run: |
          cat > StoicApp/settings.gradle << 'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "StoicApp"
          include ':app'
          EOF

          cat > StoicApp/build.gradle << 'EOF'
          plugins {
            id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          echo "android.useAndroidX=true" > StoicApp/gradle.properties

          cat > StoicApp/app/build.gradle << 'EOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.stoic.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.stoic.app"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Generate Android files
        run: |
          cat > StoicApp/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Stoic Generator" android:theme="@style/Theme.AppCompat.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > StoicApp/app/src/main/java/com/stoic/MainActivity.java << 'EOF'
          package com.stoic;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;
          import android.graphics.Color;
          import android.os.Build;
          import android.view.WindowManager;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            WebView w;
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
              if(Build.VERSION.SDK_INT>=21) getWindow().setStatusBarColor(Color.parseColor("#0a0a0f"));
              w=new WebView(this);
              setContentView(w);
              WebSettings s=w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              w.setBackgroundColor(Color.parseColor("#0a0a0f"));
              w.loadUrl("file:///android_asset/www/index.html");
            }
            public void onBackPressed(){if(w!=null&&w.canGoBack())w.goBack();else super.onBackPressed();}
          }
          EOF

          cat > StoicApp/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar"/>
          </resources>
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build APK
        run: cd StoicApp && gradle assembleDebug

      - name: Show APK
        run: ls -lh StoicApp/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: StoicGenerator-APK
          path: StoicApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
